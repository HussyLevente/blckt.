# ============================================================================
# nginx: a statikus demok es a playground kiszolgalasa
# ----------------------------------------------------------------------------
# EZ A FAJL NEM AKTIV. Bemasolando reszlet a szerver oldali beallitashoz:
#   /etc/nginx/sites-available/blckt.hu
#
# Miert kell:
#   Az nginx NEM olvassa a .htaccess fajlokat - azok csak Apache alatt elnek.
#   A public/demo/.htaccess "DirectoryIndex index.html" sora ezert a
#   szerveren nem ervenyesul, es a /demo/signal-burger/ cim 403-at ad
#   (mappa letezik, indexfajl nincs kijelolve, listazas tiltva).
#
#   A kod ezt mar nem varja meg: a demo hivatkozasok kiirjak az index.html-t,
#   igy a lap szerverbeallitas nelkul is mukodik. Az alabbi "index" sorral a
#   rovid, per-re vegzodo cim is mukodni fog - ez csak szebb, nem szukseges.
# ============================================================================

server {
    listen 443 ssl http2;
    server_name blckt.hu www.blckt.hu;

    root /var/www/blckt.hu/public;

    # A sorrend szamit: az index.php marad az elso, kulonben egy veletlenul
    # a gyokerbe kerulo index.html elottevagna a Laravel utvonalaknak.
    index index.php index.html;

    charset utf-8;

    # ── Laravel ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # ── Sablon-demok ─────────────────────────────────────────────────────
    # Onallo statikus oldalak. A PHP-t meg sem szabad hivni rajuk, es a
    # playground iframe-ben tolti oket, ezert a keretezes maradjon engedve
    # sajat origon (a SAMEORIGIN pont ezt jelenti).
    location /demo/ {
        try_files $uri $uri/ =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # A .htaccess-t sose adjuk ki. Apache alatt sose latszana; nginx alatt
    # sima szovegfajl lenne.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Gyorsitotar ──────────────────────────────────────────────────────
    # Az eszkoz-URL-ek verziozottak (?v=<modositasi ido>), ezert az egy ev
    # biztonsagos. A HTML szandekosan nem gyorsitotarazodik.
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|mp4|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 8m;
}
